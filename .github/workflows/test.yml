name: Tests

on:
  push:
    branches:
      - development
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Other runs each get
# their own group, so one never cancels another.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run the tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The install scripts build the mediasoup worker and sip.js's grammar.
      # The tests load neither, and the worker build takes minutes.
      - name: Install the dependencies
        run: npm ci --ignore-scripts

      - name: Run the tests
        run: npm test
